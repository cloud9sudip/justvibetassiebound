<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tassie Starts Here - Countdown</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b192c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
    }
    .wrapper {
      position: relative;
      max-width: 820px;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      background: #0b192c;
    }
    .wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* Sits gracefully over the ocean at the very top */
    .timer-overlay {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 25, 47, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      padding: 6px 14px;
      display: flex;
      gap: 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      text-align: center;
      z-index: 10;
    }
    .unit {
      display: flex;
      flex-direction: column;
      min-width: 34px;
    }
    .num {
      font-size: 18px;
      font-weight: 700;
      color: #ffcc00;
      line-height: 1.1;
    }
    .lbl {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #cbd5e1;
      margin-top: 2px;
    }
    /* iPhone / Small mobile adjustment */
    @media (max-width: 480px) {
      .timer-overlay {
        top: 6px;
        padding: 4px 10px;
        gap: 8px;
      }
      .unit {
        min-width: 28px;
      }
      .num {
        font-size: 15px;
      }
      .lbl {
        font-size: 7px;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <img id="ferryImg" alt="Tassie starts here" src="tassie.PNG">

    <div class="timer-overlay" id="timerBox">
      <div class="unit"><span class="num" id="days">0</span><span class="lbl">Days</span></div>
      <div class="unit"><span class="num" id="hours">0</span><span class="lbl">Hours</span></div>
      <div class="unit"><span class="num" id="mins">0</span><span class="lbl">Mins</span></div>
      <div class="unit"><span class="num" id="secs">0</span><span class="lbl">Secs</span></div>
    </div>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="headlights3.mp3" type="audio/mpeg">
    Your browser does not support audio.
  </audio>

  <script>
    const targetDate = new Date("2026-11-19T23:59:59").getTime();

    function update() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (isNaN(diff) || diff <= 0) {
        document.getElementById('timerBox').innerHTML = "<span class='num' style='padding:4px 10px;'>We're off! 🚢</span>";
        return;
      }

      document.getElementById('days').textContent = Math.floor(diff / (1000 * 60 * 60 * 24));
      document.getElementById('hours').textContent = Math.floor((diff / (1000 * 60 * 60)) % 24);
      document.getElementById('mins').textContent = Math.floor((diff / (1000 * 60)) % 60);
      document.getElementById('secs').textContent = Math.floor((diff / 1000) % 60);
    }

    update();
    setInterval(update, 1000);

    const audio = document.getElementById('bgMusic');

    function forcePlayAudio() {
      if (audio && audio.paused) {
        audio.play().then(() => {
          ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(evt => {
            document.removeEventListener(evt, forcePlayAudio, true);
            window.removeEventListener(evt, forcePlayAudio, true);
          });
        }).catch(() => {});
      }
    }

    forcePlayAudio();

    ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(evt => {
      document.addEventListener(evt, forcePlayAudio, { capture: true, passive: true });
      window.addEventListener(evt, forcePlayAudio, { capture: true, passive: true });
    });
  </script>
</body>
</html>
