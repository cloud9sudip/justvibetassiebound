<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tassie Starts Here - Countdown</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b192c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .wrapper {
      position: relative;
      max-width: 820px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      background: #1e293b;
    }
    .wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* Centered in the top ocean area */
    .timer-overlay {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 25, 47, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 10px 18px;
      display: flex;
      gap: 14px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #ffffff;
      text-align: center;
    }
    .unit {
      display: flex;
      flex-direction: column;
      min-width: 42px;
    }
    .num {
      font-size: 24px;
      font-weight: 700;
      color: #ffcc00;
      line-height: 1.1;
    }
    .lbl {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #cbd5e1;
      margin-top: 4px;
    }
    @media (max-width: 580px) {
      .timer-overlay {
        position: static;
        transform: none;
        margin: 14px auto;
        justify-content: center;
        width: fit-content;
      }
      .num { font-size: 20px; }
    }
    #musicBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: rgba(15, 23, 42, 0.85);
  color: #ffcc00;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 25px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  transition: all 0.2s ease;
  z-index: 1000;
}

#musicBtn:hover {
  transform: scale(1.05);
  background: rgba(30, 41, 59, 0.95);
}
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Image loaded through free Wikimedia/raw CDN placeholder -->
    <img id="ferryImg" alt="Tassie starts here" src="tassie.PNG">

    <div class="timer-overlay" id="timerBox">
      <div class="unit"><span class="num" id="days">0</span><span class="lbl">Days</span></div>
      <div class="unit"><span class="num" id="hours">0</span><span class="lbl">Hours</span></div>
      <div class="unit"><span class="num" id="mins">0</span><span class="lbl">Mins</span></div>
      <div class="unit"><span class="num" id="secs">0</span><span class="lbl">Secs</span></div>
    </div>
  </div>

  <script>
    // Target: November 19, 2026 at 23:59:59 (displays 16 full days)
    const targetDate = new Date("2026-11-19T23:59:59").getTime();

    function update() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (isNaN(diff) || diff <= 0) {
        document.getElementById('timerBox').innerHTML = "<span class='num' style='padding:4px 10px;'>We're off! 🚢</span>";
        return;
      }

      document.getElementById('days').textContent = Math.floor(diff / (1000 * 60 * 60 * 24));
      document.getElementById('hours').textContent = Math.floor((diff / (1000 * 60 * 60)) % 24);
      document.getElementById('mins').textContent = Math.floor((diff / (1000 * 60)) % 60);
      document.getElementById('secs').textContent = Math.floor((diff / 1000) % 60);
    }

    update();
    setInterval(update, 1000);
    const audio = document.getElementById('bgMusic');
const btn = document.getElementById('musicBtn');

function toggleMusic() {
  if (audio.paused) {
    audio.play();
    btn.textContent = '⏸ Pause Music';
  } else {
    audio.pause();
    btn.textContent = '🎵 Play Music';
  }
}

// Automatically attempts to start music on the very first touch/click anywhere on screen
document.body.addEventListener('click', function() {
  if (audio.paused) {
    audio.play().then(() => {
      btn.textContent = '⏸ Pause Music';
    }).catch(() => {});
  }
}, { once: true });
  </script>
  <!-- Background Audio Element -->
<audio id="bgMusic" loop preload="auto">
  <source src="headlights.mp3" type="audio/mpeg">
  Your browser does not support audio.
</audio>

<!-- Floating Audio Toggle Button -->
<button id="musicBtn" onclick="toggleMusic()">🎵 Play Music</button>
</body>
</html>
