<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tassie Adventure Starts Here - Countdown & Route</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #07111e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Montserrat", sans-serif;
      padding: 12px;
      overflow-x: hidden;
    }

    /* Single Unified Ship Card */
    .wrapper {
      position: relative;
      max-width: 960px;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      background: #000;
      aspect-ratio: 16 / 9;
    }

    .media-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .media-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      filter: brightness(0.92) contrast(1.05);
    }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 35% 50%, transparent 35%, rgba(7, 17, 30, 0.7) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* TOP LEFT-CENTER: Floating Countdown Pod */
    .timer-overlay {
      position: absolute;
      top: 14px;
      left: 35%;
      transform: translateX(-50%);
      background: rgba(7, 17, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      padding: 8px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #93c5fd;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .units-grid {
      display: flex;
      gap: 14px;
      text-align: center;
    }

    .unit {
      display: flex;
      flex-direction: column;
      min-width: 36px;
    }

    .num {
      font-size: 20px;
      font-weight: 700;
      color: #ffcc00;
      line-height: 1.1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .lbl {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #cbd5e1;
      margin-top: 3px;
    }

    /* RIGHT SIDE EMBEDDED: Compact Frosted Glass Tasmania Map Overlay */
    .embedded-map {
      position: absolute;
      top: 14px;
      right: 14px;
      bottom: 14px;
      width: 28%;
      max-width: 255px;
      background: rgba(7, 17, 30, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 8px 8px 6px 8px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      pointer-events: none;
    }

    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    .map-title {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #ffcc00;
    }

    .map-subtitle {
      font-size: 8px;
      color: #93c5fd;
      font-weight: 600;
    }

    .svg-box {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .svg-box svg {
      width: 100%;
      height: 100%;
      max-height: 100%;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
    }

    .route-line {
      stroke-dasharray: 6, 5;
      animation: dashMove 18s linear infinite;
    }

    @keyframes dashMove {
      to { stroke-dashoffset: -110; }
    }

    .pin-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 11px;
      fill: #0f172a;
    }

    .pin-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 8.5px;
      fill: #0369a1;
    }

    .pin-num {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 900;
      font-size: 10px;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* BOTTOM LEFT-CENTER: Heading Above Ferry Route Box (Cleared of map) */
    .bottom-cluster {
      position: absolute;
      bottom: 14px;
      left: 35%;
      transform: translateX(-50%);
      width: 62%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }

    .bottom-heading {
      text-align: center;
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9), 0 6px 24px rgba(0, 0, 0, 0.8);
    }

    .route-container {
      width: 100%;
      background: rgba(7, 17, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      padding: 7px 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.6);
    }

    .route-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .route-point {
      display: flex;
      flex-direction: column;
    }

    .route-point.right {
      text-align: right;
    }

    .port-name {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .port-time {
      font-size: 7.5px;
      font-weight: 600;
      color: #38bdf8;
      margin-top: 1px;
    }

    .route-track {
      position: relative;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin: 4px 0 2px 0;
    }

    .ship-icon {
      position: absolute;
      left: 0;
      top: -8px;
      font-size: 13px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    /* Mobile Portrait Adjustments */
    @media (max-width: 720px) {
      .wrapper {
        aspect-ratio: 4 / 3;
      }
      .timer-overlay {
        top: 8px;
        left: 33%;
        padding: 5px 10px;
      }
      .units-grid { gap: 6px; }
      .unit { min-width: 24px; }
      .num { font-size: 14px; }
      .lbl { font-size: 6.5px; }
      .status-badge { font-size: 7.5px; }

      .embedded-map {
        top: 8px;
        right: 8px;
        bottom: 8px;
        width: 31%;
        padding: 5px 5px 4px 5px;
      }
      .map-title { font-size: 7.5px; }
      .map-subtitle { display: none; }

      .bottom-cluster {
        bottom: 8px;
        left: 33%;
        width: 60%;
        gap: 4px;
      }
      .bottom-heading { font-size: 14px; }
      .route-container { padding: 4px 8px; }
      .port-name { font-size: 8px; }
      .port-time { font-size: 6.5px; }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Background Video -->
    <div class="media-container">
      <video id="bgVideo" autoplay muted loop playsinline poster="tassieship.PNG">
        <source src="tassie1.mp4" type="video/mp4">

  <!-- Background Audio Element -->
  <audio id="bgMusic" loop preload="auto">
    <source src="SP1.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Target: November 19, 2026, 23:59:00
    const targetDeparture = new Date(2026, 10, 19, 23, 59, 0).getTime();

    function update() {
      const now = Date.now();
      const diff = targetDeparture - now;

      if (diff <= 0) {
        document.getElementById('timerBox').innerHTML = "<span class='num' style='padding:6px 14px;'>Tassie Bound! 🚢</span>";
        return;
      }

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const m = Math.floor((diff / (1000 * 60)) % 60);
      const s = Math.floor((diff / 1000) % 60);

      document.getElementById('days').textContent = d;
      document.getElementById('hours').textContent = h;
      document.getElementById('mins').textContent = m;
      document.getElementById('secs').textContent = s;
    }

    update();
    setInterval(update, 1000);

    // Audio Autoplay & Screen Tap Handler
    const audio = document.getElementById('bgMusic');

    function playAudio() {
      if (audio && audio.paused) {
        audio.play().then(() => {
          ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(evt => {
            document.removeEventListener(evt, playAudio, true);
            window.removeEventListener(evt, playAudio, true);
          });
        }).catch(() => {});
      }
    }

    playAudio();
    ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(evt => {
      document.addEventListener(evt, playAudio, { capture: true, passive: true });
      window.addEventListener(evt, playAudio, { capture: true, passive: true });
    });
  </script>
</body>
