<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tassie Starts Here - Countdown</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #07111e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Montserrat", sans-serif;
      padding: 12px;
      overflow-x: hidden;
    }

    .wrapper {
      position: relative;
      max-width: 820px;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.75);
      background: #000;
      aspect-ratio: 16 / 9;
    }

    .media-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .media-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      filter: brightness(0.92) contrast(1.05);
    }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(7, 17, 30, 0.65) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Floating Countdown Pod at the Top */
    .timer-overlay {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(7, 17, 30, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      padding: 8px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #93c5fd;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .units-grid {
      display: flex;
      gap: 14px;
      text-align: center;
    }

    .unit {
      display: flex;
      flex-direction: column;
      min-width: 38px;
    }

    .num {
      font-size: 20px;
      font-weight: 700;
      color: #ffcc00;
      line-height: 1.1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .lbl {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #cbd5e1;
      margin-top: 3px;
    }

    /* Bottom "Tassie starts here" Banner */
    .bottom-heading {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      color: #ffffff;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.85), 0 6px 24px rgba(0, 0, 0, 0.7);
      z-index: 10;
      pointer-events: none;
    }

    @media (max-width: 580px) {
      .wrapper {
        aspect-ratio: 4 / 3;
      }
      .timer-overlay {
        top: 10px;
        padding: 6px 12px;
      }
      .units-grid {
        gap: 8px;
      }
      .unit {
        min-width: 28px;
      }
      .num {
        font-size: 16px;
      }
      .lbl {
        font-size: 7px;
      }
      .bottom-heading {
        bottom: 10px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Background Video -->
    <div class="media-container">
      <video id="bgVideo" autoplay muted loop playsinline poster="tassieship.PNG">
        <source src="Titanic.mp3" type="video/mp3">
      </video>
    </div>

    <div class="vignette-overlay"></div>

    <!-- Countdown Timer at the TOP -->
    <div class="timer-overlay" id="timerBox">
      <div class="status-badge">
        <span class="pulse-dot"></span> Tassie Countdown
      </div>
      <div class="units-grid">
        <div class="unit"><span class="num" id="days">0</span><span class="lbl">Days</span></div>
        <div class="unit"><span class="num" id="hours">0</span><span class="lbl">Hours</span></div>
        <div class="unit"><span class="num" id="mins">0</span><span class="lbl">Mins</span></div>
        <div class="unit"><span class="num" id="secs">0</span><span class="lbl">Secs</span></div>
      </div>
    </div>

    <!-- Bottom Text Header -->
    <div class="bottom-heading">Tassie starts here</div>
  </div>

  <!-- Background Audio Element -->
  <audio id="bgMusic" loop preload="auto">
    <source src="titanic.mp3" type="audio/mpeg">
    Your browser does not support audio.
  </audio>

  <script>
    const targetDate = new Date("2026-11-19T23:59:59").getTime();

    function update() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (isNaN(diff) || diff <= 0) {
        document.getElementById('timerBox').innerHTML = "<span class='num' style='padding:6px 14px;'>We're off! 🚢</span>";
        return;
      }

      document.getElementById('days').textContent = Math.floor(diff / (1000 * 60 * 60 * 24));
      document.getElementById('hours').textContent = Math.floor((diff / (1000 * 60 * 60)) % 24);
      document.getElementById('mins').textContent = Math.floor((diff / (1000 * 60)) % 60);
      document.getElementById('secs').textContent = Math.floor((diff / 1000) % 60);
    }

    update();
    setInterval(update, 1000);

    // Audio Autoplay Handler
    const audio = document.getElementById('bgMusic');

    function forcePlayAudio() {
      if (audio && audio.paused) {
        audio.play().then(() => {
          ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(evt => {
            document.removeEventListener(evt, forcePlayAudio, true);
            window.removeEventListener(evt, forcePlayAudio, true);
          });
        }).catch(() => {});
      }
    }

    forcePlayAudio();

    ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(evt => {
      document.addEventListener(evt, forcePlayAudio, { capture: true, passive: true });
      window.addEventListener(evt, forcePlayAudio, { capture: true, passive: true });
    });
  </script>
</body>
</html>
