<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tassie Adventure Starts Here - Full Itinerary & Countdown</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #07111e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Montserrat", sans-serif;
      padding: 12px;
      overflow-x: hidden;
    }

    /* Single Unified Ship Card */
    .wrapper {
      position: relative;
      max-width: 980px;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      background: #000;
      aspect-ratio: 16 / 9;
    }

    .media-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .media-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      filter: brightness(0.92) contrast(1.05);
    }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 35% 50%, transparent 35%, rgba(7, 17, 30, 0.7) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* TOP LEFT-CENTER: Floating Countdown Pod */
    .timer-overlay {
      position: absolute;
      top: 14px;
      left: 34%;
      transform: translateX(-50%);
      background: rgba(7, 17, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      padding: 8px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #93c5fd;
      white-space: nowrap;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .units-grid {
      display: flex;
      gap: 14px;
      text-align: center;
    }

    .unit {
      display: flex;
      flex-direction: column;
      min-width: 36px;
    }

    .num {
      font-size: 20px;
      font-weight: 700;
      color: #ffcc00;
      line-height: 1.1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .lbl {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #cbd5e1;
      margin-top: 3px;
    }

    /* RIGHT SIDE EMBEDDED: Interactive Tasmania Full Loop Map */
    .embedded-map {
      position: absolute;
      top: 12px;
      right: 12px;
      bottom: 12px;
      width: 30%;
      max-width: 275px;
      background: rgba(7, 17, 30, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      padding: 8px 8px 6px 8px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }

    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    .map-title {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #ffcc00;
    }

    .map-subtitle {
      font-size: 8px;
      color: #93c5fd;
      font-weight: 600;
    }

    .svg-box {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .svg-box svg {
      width: 100%;
      height: 100%;
      max-height: 100%;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
    }

    .route-line {
      stroke-dasharray: 6, 5;
      animation: dashMove 18s linear infinite;
    }

    .return-line {
      stroke-dasharray: 4, 4;
      animation: dashReturn 18s linear infinite;
    }

    @keyframes dashMove {
      to { stroke-dashoffset: -110; }
    }

    @keyframes dashReturn {
      to { stroke-dashoffset: -80; }
    }

    /* Interactive Stop Styling */
    .stop-group {
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .stop-group:hover rect {
      fill: #fef08a;
    }

    .stop-group.active rect {
      fill: #ffcc00;
      stroke: #ffffff;
      stroke-width: 1.5;
    }

    .pin-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 10.5px;
      fill: #0f172a;
      pointer-events: none;
    }

    .pin-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 8px;
      fill: #0369a1;
      pointer-events: none;
    }

    .pin-num {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 900;
      font-size: 9.5px;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    /* Interactive Stop Highlight Card inside Map */
    .stop-info-card {
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255, 204, 0, 0.48);
      border-radius: 9px;
      padding: 6px 8px;
      margin-top: 3px;
      transition: all 0.2s ease;
    }

    .stop-info-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
      gap: 4px;
    }

    .stop-info-title {
      font-size: 9px;
      font-weight: 800;
      color: #ffcc00;
    }

    .stop-info-leg {
      font-size: 7.5px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.16);
      padding: 1px 5px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .stop-info-desc {
      font-size: 7.8px;
      line-height: 1.32;
      color: #e2e8f0;
    }

    /* BOTTOM LEFT-CENTER: Heading Above Ferry Route Box */
    .bottom-cluster {
      position: absolute;
      bottom: 14px;
      left: 34%;
      transform: translateX(-50%);
      width: 60%;
      max-width: 510px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }

    .bottom-heading {
      text-align: center;
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9), 0 6px 24px rgba(0, 0, 0, 0.8);
    }

    .route-container {
      width: 100%;
      background: rgba(7, 17, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      padding: 7px 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.6);
    }

    .route-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .route-point {
      display: flex;
      flex-direction: column;
    }

    .route-point.right {
      text-align: right;
    }

    .port-name {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .port-time {
      font-size: 7.5px;
      font-weight: 600;
      color: #38bdf8;
      margin-top: 1px;
    }

    .route-track {
      position: relative;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin: 4px 0 2px 0;
    }

    .route-progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #ffcc00);
      border-radius: 2px;
      transition: width 1s linear;
    }

    .ship-icon {
      position: absolute;
      left: 0%;
      top: -8px;
      font-size: 13px;
      transform: translateX(-20%);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
      transition: left 1s linear;
    }

    /* Mobile Portrait Adjustments */
    @media (max-width: 720px) {
      .wrapper {
        aspect-ratio: 4 / 3;
      }
      .timer-overlay {
        top: 8px;
        left: 32%;
        padding: 5px 10px;
      }
      .units-grid { gap: 6px; }
      .unit { min-width: 24px; }
      .num { font-size: 14px; }
      .lbl { font-size: 6.5px; }
      .status-badge { font-size: 7px; }

      .embedded-map {
        top: 8px;
        right: 8px;
        bottom: 8px;
        width: 34%;
        padding: 5px 5px 4px 5px;
      }
      .map-title { font-size: 7.5px; }
      .map-subtitle { display: none; }
      .stop-info-card { padding: 4px 5px; }
      .stop-info-title { font-size: 7.5px; }
      .stop-info-leg { display: none; }
      .stop-info-desc { font-size: 6.5px; line-height: 1.2; }

      .bottom-cluster {
        bottom: 8px;
        left: 32%;
        width: 58%;
        gap: 4px;
      }
      .bottom-heading { font-size: 14px; }
      .route-container { padding: 4px 8px; }
      .port-name { font-size: 8px; }
      .port-time { font-size: 6.5px; }
    }
  </style>
</head>
<body>

  <div class="wrapper">

            <line x1="235" y1="372" x2="282" y2="375" stroke="#ffffff" stroke-width="1.4" />
            <rect x="278" y="360" width="108" height="25" rx="12" fill="#ffffff" />
            <circle cx="291" cy="372.5" r="8.5" fill="#ef4444" />
            <text x="291" y="372.5" class="pin-num">10</text>
            <text x="304" y="376" class="pin-label">Bruny Island</text>
          </g>

          <!-- 11. Campbell Town (Return Coffee Stop) -->
          <g class="stop-group" data-stop="10" filter="url(#cardShadow)">
            <line x1="246" y1="195" x2="155" y2="215" stroke="#38bdf8" stroke-width="1.4" />
            <rect x="44" y="204" width="116" height="28" rx="10" fill="#e0f2fe" />
            <circle cx="57" cy="218" r="8" fill="#0284c7" />
            <text x="57" y="218" class="pin-num">11</text>
            <text x="69" y="215" class="pin-label">Campbell Town</text>
            <text x="69" y="226" class="pin-sub">☕ Fri Return Stop</text>
          </g>

          <!-- Compass Rose -->
          <g transform="translate(50, 388)">
            <circle cx="0" cy="0" r="16" fill="rgba(7,17,30,0.6)" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
            <polygon points="0,-11 2.5,0 0,11 -2.5,0" fill="#ffcc00" />
            <polygon points="-11,0 0,-2.5 11,0 0,2.5" fill="#93c5fd" />
            <text x="0" y="-18" fill="#cbd5e1" font-size="7.5" font-weight="800" text-anchor="middle">N</text>
          </g>
        </svg>
      </div>

      <!-- Interactive Stop Highlight Card -->
      <div class="stop-info-card" id="stopInfoCard">
        <div class="stop-info-top">
          <span class="stop-info-title" id="stopTitle">1. Devonport Arrival</span>
          <span class="stop-info-leg" id="stopLeg">Sat 21 Nov • 6 AM</span>
        </div>
        <div class="stop-info-desc" id="stopDesc">Disembark Spirit of Tasmania, head to Launceston & return to Devonport for Night 1.</div>
      </div>
    </div>
  </div>

  <!-- Single Background Audio Element -->
  <audio id="bgMusic" loop preload="auto">
    <source src="TheNights.mp3" type="audio/mpeg">
  </audio>

  <script>
    // ==========================================
    // 1. 5-PHASE JOURNEY & LIVE FERRY TRACKER
    // ==========================================
    const sydneyDepart = new Date(2026, 10, 19, 23, 59, 0).getTime(); // Thu Nov 19, 11:59 PM
    const ferryDepart  = new Date(2026, 10, 20, 18, 45, 0).getTime(); // Fri Nov 20, 6:45 PM
    const ferryArrive  = new Date(2026, 10, 21, 6, 0, 0).getTime();   // Sat Nov 21, 6:00 AM
    const returnDay    = new Date(2026, 10, 27, 18, 45, 0).getTime(); // Fri Nov 27, 6:45 PM

    const phaseLabel    = document.getElementById('phaseLabel');
    const mainHeading   = document.getElementById('mainHeading');
    const shipIcon      = document.getElementById('shipIcon');
    const progressFill  = document.getElementById('progressFill');
    const leftPortName  = document.getElementById('leftPortName');
    const leftPortTime  = document.getElementById('leftPortTime');
    const rightPortName = document.getElementById('rightPortName');
    const rightPortTime = document.getElementById('rightPortTime');

    function renderCountdown(diff) {
      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const m = Math.floor((diff / (1000 * 60)) % 60);
      const s = Math.floor((diff / 1000) % 60);

      document.getElementById('days').textContent = d;
      document.getElementById('hours').textContent = h;
      document.getElementById('mins').textContent = m;
      document.getElementById('secs').textContent = s;
    }

    function update() {
      const now = Date.now();

      if (now < sydneyDepart) {
        // PHASE 1: Pre-departure countdown
        phaseLabel.textContent = "Tassie Countdown";
        shipIcon.style.left = "0%";
        progressFill.style.width = "0%";
        renderCountdown(sydneyDepart - now);

      } else if (now < ferryDepart) {
        // PHASE 2: Driving Sydney -> Geelong
        phaseLabel.textContent = "En Route to Geelong 🚗";
        mainHeading.textContent = "Boarding Spirit of Tasmania Soon";
        shipIcon.style.left = "0%";
        progressFill.style.width = "0%";
        renderCountdown(ferryDepart - now);

      } else if (now < ferryArrive) {
        // PHASE 3: Live Bass Strait Crossing (Ship glides across bar!)
        phaseLabel.textContent = "Sailing Bass Strait 🌊";
        mainHeading.textContent = "Cruising to Devonport";
        const totalSailing = ferryArrive - ferryDepart;
        const sailed = now - ferryDepart;
        const pct = Math.min(95, Math.max(2, (sailed / totalSailing) * 100));
        shipIcon.style.left = pct + "%";
        progressFill.style.width = pct + "%";
        renderCountdown(ferryArrive - now);

      } else if (now < returnDay) {
        // PHASE 4: Exploring Tasmania (Days 1 to 7)
        const tripDay = Math.floor((now - ferryArrive) / (1000 * 60 * 60 * 24)) + 1;
        phaseLabel.textContent = "Tassie Adventure Live!";
        mainHeading.textContent = "Exploring Tasmania • Day " + tripDay;
        leftPortName.textContent = "📍 Devonport";
        leftPortTime.textContent = "21st Nov • Arrived";
        rightPortName.textContent = "Devonport Return 🏁";
        rightPortTime.textContent = "27th Nov • Homebound";
        const islandPct = Math.min(95, Math.max(5, ((now - ferryArrive) / (returnDay - ferryArrive)) * 100));
        shipIcon.textContent = "🚗";
        shipIcon.style.left = islandPct + "%";
        progressFill.style.width = islandPct + "%";
        renderCountdown(returnDay - now);

      } else {
        // PHASE 5: Homebound sailing
        phaseLabel.textContent = "Homebound Voyage 🚢";
        mainHeading.textContent = "Memories Made in Tassie ✨";
        shipIcon.textContent = "🚢";
        shipIcon.style.left = "94%";
        progressFill.style.width = "100%";
        document.getElementById('unitsGrid').innerHTML =
          `<div class="unit" style="min-width: 150px;"><span class="num">Trip Complete</span><span class="lbl">Welcome Home!</span></div>`;
      }
    }

    update();
    setInterval(update, 1000);

    // ==========================================
    // 2. INTERACTIVE 7-DAY STOP EXPLORER
    // ==========================================
    const stopsData = [
      {
        title: "1. Devonport Arrival & Base",
        leg: "Sat 21 Nov • Night 1",
        desc: "6:00 AM arrival on Spirit of Tasmania. Day trip east to Launceston & back to Devonport to stay."
      },
      {
        title: "2. Launceston & Lavender",
        leg: "Sat 21 Nov",
        desc: "Penny Royal Adventures, Cataract Gorge walk & Bridestowe Lavender Estate before returning to Devonport."
      },
      {
        title: "3. Cradle Mountain",
        leg: "Sun 22 Nov",
        desc: "Dove Lake Circuit & Ronny Creek wombats, then cross-island drive east to St Helens (2 nights)."
      },
      {
        title: "4. St Helens & Bay of Fires",
        leg: "Sun 22 – Mon 23 Nov",
        desc: "2-night base. Explore Binalong Bay, The Gardens & glowing orange lichen boulders."
      },
      {
        title: "5. Blue Lake & Legerwood",
        leg: "Mon 23 Nov Loop",
        desc: "Scenic inland loop to Little Blue Lake & Legerwood Carved Memorial Trees from St Helens."
      },
      {
        title: "6. Bicheno Blowhole",
        leg: "Tue 24 Nov",
        desc: "Morning coastal drive south to watch the granite blowhole geyser before Freycinet."
      },
      {
        title: "7. Freycinet & Devil's Corner",
        leg: "Tue 24 Nov",
        desc: "Wineglass Bay Lookout, Cape Tourville Lighthouse & Devil's Corner lunch, then evening drive to Hobart."
      },
      {
        title: "8. Hobart Base",
        leg: "Tue 24 – Thu 26 Nov",
        desc: "Southern hub for Salamanca waterfront, Bruny Island day trip & mountain excursions."
      },
      {
        title: "9. Mt Wellington, Richmond & Falls",
        leg: "Thu 26 Nov",
        desc: "kunanyi summit views, historic Richmond Bridge & Russell Falls at Mt Field National Park."
      },
      {
        title: "10. Bruny Island Full Day",
        leg: "Wed 25 Nov",
        desc: "Kettering ferry, The Neck Lookout, Adventure Bay white wallabies, Cape Bruny Lighthouse & local oysters."
      },
      {
        title: "11. Campbell Town Coffee Stop",
        leg: "Fri 27 Nov Return",
        desc: "Midlands Highway coffee break & Red Bridge walk on the drive back to Devonport for the ferry home."
      }
    ];

    const stopGroups = document.querySelectorAll('.stop-group');
    const stopTitle  = document.getElementById('stopTitle');
    const stopLeg    = document.getElementById('stopLeg');
    const stopDesc   = document.getElementById('stopDesc');

    stopGroups.forEach(group => {
      group.addEventListener('click', (e) => {
        e.stopPropagation();
        stopGroups.forEach(g => g.classList.remove('active'));
        group.classList.add('active');

        const idx = parseInt(group.getAttribute('data-stop'), 10);
        const info = stopsData[idx];
        if (info) {
          stopTitle.textContent = info.title;
          stopLeg.textContent   = info.leg;
          stopDesc.textContent  = info.desc;
        }
      });
    });

    // ==========================================
    // 3. SINGLE AUDIO AUTOPLAY & TAP UNLOCK
    // ==========================================
    const audio = document.getElementById('bgMusic');

    function playAudio() {
      if (audio && audio.paused) {
        audio.play().then(() => {
          ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(evt => {
            document.removeEventListener(evt, playAudio, true);
            window.removeEventListener(evt, playAudio, true);
          });
        }).catch(() => {});
      }
    }

    playAudio();
    ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(evt => {
      document.addEventListener(evt, playAudio, { capture: true, passive: true });
      window.addEventListener(evt, playAudio, { capture: true, passive: true });
    });
  </script>
</body>
</html>
