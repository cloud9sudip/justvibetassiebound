<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tassie starts here - Countdown</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #07111e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    /* Container: uses CSS Grid to pin all layers on top of each other */
    .wrapper {
      position: relative;
      width: 100%;
      max-width: 820px;
      height: 480px;
      border-radius: 18px;
      overflow: hidden;
      background: #0b192c;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    /* Background Layer */
    .media-layer {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
    }

    .media-layer video,
    .media-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.9);
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(7, 17, 30, 0.7) 100%);
      pointer-events: none;
    }

    /* Content Overlay Layer */
    .content-layer {
      grid-area: 1 / 1;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 14px 12px;
      pointer-events: none;
    }

    /* TOP: Countdown Box */
    .timer-overlay {
      background: rgba(7, 17, 30, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      padding: 8px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #93c5fd;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .units-grid {
      display: flex;
      gap: 14px;
      text-align: center;
    }

    .unit {
      display: flex;
      flex-direction: column;
      min-width: 38px;
    }

    .num {
      font-size: 20px;
      font-weight: 700;
      color: #ffcc00;
      line-height: 1.1;
    }

    .lbl {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #cbd5e1;
      margin-top: 3px;
    }

    /* BOTTOM: Heading + Route Bar */
    .bottom-cluster {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .bottom-heading {
      text-align: center;
      color: #ffffff;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.85);
    }

    .route-container {
      width: 100%;
      background: rgba(7, 17, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      padding: 8px 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.6);
    }

    .route-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .route-point {
      display: flex;
      flex-direction: column;
    }

    .route-point.right {
      text-align: right;
    }

    .port-name {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .port-time {
      font-size: 8px;
      font-weight: 600;
      color: #38bdf8;
      margin-top: 1px;
    }

    .route-track {
      position: relative;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin: 6px 0 2px 0;
    }

    .ship-icon {
      position: absolute;
      left: 0;
      top: -8px;
      font-size: 13px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    @media (max-width: 580px) {
      .wrapper {
        height: 420px;
      }
      .content-layer {
        padding: 10px 8px;
      }
      .timer-overlay {
        padding: 6px 12px;
      }
      .units-grid { gap: 8px; }
      .unit { min-width: 28px; }
      .num { font-size: 16px; }
      .lbl { font-size: 7px; }
      .bottom-heading { font-size: 20px; }
      .route-container { padding: 6px 10px; }
      .port-name { font-size: 9px; }
      .port-time { font-size: 7px; }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Layer 1: Background Media -->
    <div class="media-layer">
      <video id="bgVideo" autoplay muted loop playsinline poster="tassieship.PNG">
        <source src="tassie1.mp4" type="video/mp4">
        <img src="tassieship.PNG" alt="Spirit of Tasmania">
      </video>
      <div class="vignette"></div>
    </div>

    <!-- Layer 2: On-screen Content -->
    <div class="content-layer">
      <!-- TOP: Timer -->
      <div class="timer-overlay" id="timerBox">
        <div class="status-badge">
          <span class="pulse-dot"></span> Tassie Countdown
        </div>
        <div class="units-grid">
          <div class="unit"><span class="num" id="days">--</span><span class="lbl">Days</span></div>
          <div class="unit"><span class="num" id="hours">--</span><span class="lbl">Hours</span></div>
          <div class="unit"><span class="num" id="mins">--</span><span class="lbl">Mins</span></div>
          <div class="unit"><span class="num" id="secs">--</span><span class="lbl">Secs</span></div>
        </div>
      </div>

      <!-- BOTTOM: Heading + Route -->
      <div class="bottom-cluster">
        <div class="bottom-heading">Tassie starts here</div>

        <div class="route-container">
          <div class="route-labels">
            <div class="route-point">
              <span class="port-name">📍 Geelong</span>
              <span class="port-time">20th Nov • 6:45 PM</span>
            </div>
            <div class="route-point right">
              <span class="port-name">Devonport 🏁</span>
              <span class="port-time">21st Nov • 6:00 AM</span>
            </div>
          </div>
          <div class="route-track">
            <span class="ship-icon">🚢</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Audio Element -->
  <audio id="bgMusic" loop preload="auto">
    <source src="Titanic.mp3" type="audio/mpeg">
    <source src="titanic.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Target: November 20, 2026 at 6:45 PM (Month 10 is November in JS)
    var targetDeparture = new Date(2026, 10, 20, 18, 45, 0).getTime();

    function update() {
      var now = Date.now();
      var diff = targetDeparture - now;

      if (diff <= 0) {
        document.getElementById('timerBox').innerHTML = "<span class='num' style='padding:6px 14px;'>Bon Voyage! 🚢</span>";
        return;
      }

      var d = Math.floor(diff / (1000 * 60 * 60 * 24));
      var h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      var m = Math.floor((diff / (1000 * 60)) % 60);
      var s = Math.floor((diff / 1000) % 60);

      document.getElementById('days').textContent = d;
      document.getElementById('hours').textContent = h;
      document.getElementById('mins').textContent = m;
      document.getElementById('secs').textContent = s;
    }

    update();
    setInterval(update, 1000);

    // Audio Autoplay & Screen Tap Handler
    var audio = document.getElementById('bgMusic');

    function playAudio() {
      if (audio && audio.paused) {
        audio.play().then(function() {
          ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(function(evt) {
            document.removeEventListener(evt, playAudio, true);
          });
        }).catch(function() {});
      }
    }

    playAudio();
    ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(function(evt) {
      document.addEventListener(evt, playAudio, { capture: true, passive: true });
    });
  </script>
</body>
</html>
