<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tassie Starts Here - Countdown</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b192c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Montserrat", sans-serif;
      padding: 12px;
      overflow-x: hidden;
    }

    .wrapper {
      position: relative;
      max-width: 820px;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      background: #0b192c;
    }

    /* Ship Ocean Swell Floating Animation */
    @keyframes oceanSway {
      0% {
        transform: scale(1.03) translateY(0px) rotate(0deg);
      }
      35% {
        transform: scale(1.03) translateY(-4px) rotate(0.35deg);
      }
      70% {
        transform: scale(1.03) translateY(3px) rotate(-0.35deg);
      }
      100% {
        transform: scale(1.03) translateY(0px) rotate(0deg);
      }
    }

    .media-container {
      width: 100%;
      display: block;
      position: relative;
      animation: oceanSway 7s ease-in-out infinite alternate;
      transform-origin: center center;
    }

    .media-container video,
    .media-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Seamless cover to mask the image's baked-in lower text */
    .baked-text-mask {
      position: absolute;
      bottom: 22%;
      left: 15%;
      width: 70%;
      height: 28%;
      background: radial-gradient(ellipse at center, rgba(12, 34, 60, 0.92) 0%, rgba(12, 34, 60, 0.7) 45%, rgba(12, 34, 60, 0) 75%);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 5;
      pointer-events: none;
    }

    /* Big Bold Top Header (matching the official ad typography) */
    .top-heading {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      text-align: center;
      color: #ffffff;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: none;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8), 0 6px 25px rgba(0, 0, 0, 0.6);
      z-index: 10;
      pointer-events: none;
    }

    /* Bottom Countdown Timer */
    .timer-overlay {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 25, 47, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      padding: 8px 18px;
      display: flex;
      gap: 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .unit {
      display: flex;
      flex-direction: column;
      min-width: 40px;
    }

    .num {
      font-size: 20px;
      font-weight: 700;
      color: #ffcc00;
      line-height: 1.1;
    }

    .lbl {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #cbd5e1;
      margin-top: 3px;
    }

    /* iPhone & Mobile Viewports */
    @media (max-width: 580px) {
      .top-heading {
        top: 8px;
        font-size: 24px;
      }
      .timer-overlay {
        bottom: 10px;
        padding: 6px 12px;
        gap: 8px;
      }
      .unit {
        min-width: 28px;
      }
      .num {
        font-size: 16px;
      }
      .lbl {
        font-size: 7px;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="media-container">
      <video id="bgVideo" autoplay muted loop playsinline poster="tassieship.PNG">
        <source src="tassie.mp4" type="video/mp4">
        <img id="ferryImg" alt="Spirit of Tasmania" src="tassieship.PNG">
      </video>
    </div>

    <!-- Soft blend over the image's original baked-in text -->
    <div class="baked-text-mask"></div>

    <!-- Top Text Header (Scaled Up & Bold) -->
    <div class="top-heading">Tassie starts here</div>

    <!-- Countdown Timer -->
    <div class="timer-overlay" id="timerBox">
      <div class="unit"><span class="num" id="days">0</span><span class="lbl">Days</span></div>
      <div class="unit"><span class="num" id="hours">0</span><span class="lbl">Hours</span></div>
      <div class="unit"><span class="num" id="mins">0</span><span class="lbl">Mins</span></div>
      <div class="unit"><span class="num" id="secs">0</span><span class="lbl">Secs</span></div>
    </div>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="headlight4.mp3" type="audio/mpeg">
    Your browser does not support audio.
  </audio>

  <script>
    const targetDate = new Date("2026-11-19T23:59:59").getTime();

    function update() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (isNaN(diff) || diff <= 0) {
        document.getElementById('timerBox').innerHTML = "<span class='num' style='padding:4px 10px;'>We're off! 🚢</span>";
        return;
      }

      document.getElementById('days').textContent = Math.floor(diff / (1000 * 60 * 60 * 24));
      document.getElementById('hours').textContent = Math.floor((diff / (1000 * 60 * 60)) % 24);
      document.getElementById('mins').textContent = Math.floor((diff / (1000 * 60)) % 60);
      document.getElementById('secs').textContent = Math.floor((diff / 1000) % 60);
    }

    update();
    setInterval(update, 1000);

    const audio = document.getElementById('bgMusic');

    function forcePlayAudio() {
      if (audio && audio.paused) {
        audio.play().then(() => {
          ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(evt => {
            document.removeEventListener(evt, forcePlayAudio, true);
            window.removeEventListener(evt, forcePlayAudio, true);
          });
        }).catch(() => {});
      }
    }

    forcePlayAudio();

    ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(evt => {
      document.addEventListener(evt, forcePlayAudio, { capture: true, passive: true });
      window.addEventListener(evt, forcePlayAudio, { capture: true, passive: true });
    });
  </script>
</body>
</html>
